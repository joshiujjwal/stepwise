<svg xmlns="http://www.w3.org/2000/svg" width="1158" height="640" viewBox="0 0 1158 640" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1158" height="640" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#1e1e1e"/></marker></defs>
<text x="24" y="44" font-size="22" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Micro-task lifecycle (v1)</text>
<rect x="44" y="170" width="190" height="70" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="121" y="210" font-size="16" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">todo</text>
<rect x="344" y="170" width="190" height="70" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="391" y="210" font-size="16" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">in_progress</text>
<rect x="644" y="170" width="190" height="70" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="664" y="210" font-size="16" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">awaiting approval</text>
<rect x="944" y="170" width="190" height="70" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="1021" y="210" font-size="16" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">done</text>
<rect x="344" y="380" width="190" height="70" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="408" y="420" font-size="16" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">blocked</text>
<rect x="644" y="380" width="190" height="70" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="699" y="420" font-size="16" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">re-tasked</text>
<rect x="944" y="380" width="190" height="70" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="973" y="420" font-size="16" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">todo (children)</text>
<polyline points="234,205 344,205" fill="none" stroke="#1e1e1e" stroke-width="1" marker-end="url(#ah)"/>
<rect x="267" y="180" width="43" height="21" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="272" y="194" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">start</text>
<polyline points="534,205 644,205" fill="none" stroke="#1e1e1e" stroke-width="1" marker-end="url(#ah)"/>
<rect x="528" y="180" width="122" height="21" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="533" y="194" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">submit + evidence</text>
<polyline points="834,205 944,205" fill="none" stroke="#1e1e1e" stroke-width="1" marker-end="url(#ah)"/>
<rect x="808" y="180" width="161" height="21" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="813" y="194" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">confirm  ✓ all criteria</text>
<polyline points="664,240 604,300 514,240" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="466" y="287" width="175" height="21" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="471" y="301" font-size="12" fill="#868e96" text-anchor="start" font-family="Helvetica, Arial, sans-serif">reject (criteria not met)</text>
<polyline points="439,240 439,380" fill="none" stroke="#ffc9c9" stroke-width="1" marker-end="url(#ah)"/>
<rect x="449" y="299" width="135" height="21" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="454" y="313" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">I&#x27;m stuck (+reason)</text>
<polyline points="504,240 674,380" fill="none" stroke="#d0bfff" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="513" y="341" width="181" height="21" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="518" y="355" font-size="12" fill="#d0bfff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">break this down (any task)</text>
<polyline points="534,415 644,415" fill="none" stroke="#1e1e1e" stroke-width="1" marker-end="url(#ah)"/>
<rect x="554" y="390" width="69" height="21" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="559" y="404" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">decompose</text>
<polyline points="834,415 944,415" fill="none" stroke="#1e1e1e" stroke-width="1" marker-end="url(#ah)"/>
<rect x="825" y="390" width="128" height="21" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="830" y="404" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">spawns finer tasks</text>
<rect x="44" y="500" width="1090" height="70" rx="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
<text x="64" y="527" font-size="14" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Idea status (derived from its leaf tasks):</text>
<text x="64" y="553" font-size="14" fill="#868e96" text-anchor="start" font-family="Helvetica, Arial, sans-serif">planning  →  active  →  stalled (≥1 blocked leaf)  →  done (all leaf tasks done)</text>
<text x="44" y="612" font-size="13" fill="#868e96" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Legend:</text>
<rect x="114" y="596" width="44" height="20" rx="8" fill="#e9ecef" stroke="none" stroke-width="1"/>
<text x="123" y="609" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">todo</text>
<rect x="170" y="596" width="90" height="20" rx="8" fill="#a5d8ff" stroke="none" stroke-width="1"/>
<text x="179" y="609" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">in progress</text>
<rect x="272" y="596" width="130" height="20" rx="8" fill="#ffec99" stroke="none" stroke-width="1"/>
<text x="281" y="609" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">awaiting approval</text>
<rect x="414" y="596" width="44" height="20" rx="8" fill="#b2f2bb" stroke="none" stroke-width="1"/>
<text x="423" y="609" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">done</text>
<rect x="470" y="596" width="64" height="20" rx="8" fill="#ffc9c9" stroke="none" stroke-width="1"/>
<text x="479" y="609" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">blocked</text>
<rect x="546" y="596" width="77" height="20" rx="8" fill="#d0bfff" stroke="none" stroke-width="1"/>
<text x="555" y="609" font-size="12" fill="#1e1e1e" text-anchor="start" font-family="Helvetica, Arial, sans-serif">re-tasked</text>
</svg>