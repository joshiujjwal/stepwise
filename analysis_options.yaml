include: package:flutter_lints/flutter.yaml

# Stepwise prefers explicit, declarative, immutable-by-default code.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat missing await and dead code as build-breaking.
    unawaited_futures: error

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_final_locals: true
    prefer_final_fields: true
    avoid_print: true
    # NOTE: `require_trailing_commas` is intentionally omitted. Dart 3.x's "tall"
    # formatter manages trailing commas itself; the lint conflicts with it on
    # long wrapped single-argument calls. `dart format` is the source of truth.
    always_declare_return_types: true
